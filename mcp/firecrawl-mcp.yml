tools:
- name: firecrawl_scrape
  description: 'Scrape one URL and return its content: markdown by default, or HTML, links, screenshots,
    branding data, a targeted answer, or JSON matching a supplied schema. Use it when the request identifies
    a page and needs its content or defined fields. Use `firecrawl_search` when additional web sources
    are needed; on an authenticated session, `firecrawl_map` lists a site''s URLs and `firecrawl_crawl`
    collects a set of pages.


    Firecrawl may serve recently indexed content; set `maxAge: 0` for a live fetch or a smaller `maxAge`
    to bound staleness. A successful response does not by itself confirm the page is still current. A
    named browser profile loads saved session data without saving changes to it. Authenticated responses
    can include a `metadata.scrapeId` for optional scrape feedback.


    On an authenticated session with Alexandria access, `firecrawl_search` and `firecrawl_find_tools`
    can discover providers for the same fields across several pages; a matching provider returns typed
    records in one call. Keyless sessions have no provider matches.


    Alexandria mode, on an authenticated session with Alexandria access: `alexandria` selects catalogued
    capability execution and is mutually exclusive with `url`.'
- name: firecrawl_search
  description: 'Search web, news, or image sources and return ranked results with query-relevant highlights.
    Each web result is a title, URL, and description; use `firecrawl_scrape` on a result URL when the
    excerpt is not enough.


    Authenticated search also returns matching Alexandria data providers in data.tools (companies, people,
    jobs, finance and filings, public records and government spending, real estate, places and restaurants,
    retail and prices, package registries and developer data, news, research, and more). Prefer a provider
    over scraping pages when the task needs the same fields across several entities, exact figures or
    timestamps, provenance, or many records; use web results when they already answer the question. Authenticated
    searches always add alexandria to the sources, so sources: ["web"] also returns providers; domainTools:
    false turns off website-matched tools only.


    On an authenticated session, tool matches describe available capabilities; `firecrawl_find_tools`
    returns their contracts and `firecrawl_scrape` with an `alexandria` body executes a selected capability.
    Keyless sessions get no Alexandria matches in data.tools.


    For a programming question, add `categories: ["developer"]`; its hits return in `data.web` with `category:
    "developer"`. For a legal or regulatory question, `categories: ["gov"]` returns hits in `data.web`
    with `category: "gov"` and cannot be combined with other categories; authenticated sessions also have
    `firecrawl_gov_search` as the dedicated tool. Verify gov results'' issuer, jurisdiction, status, and
    version before citing current law. `categories: ["research"]` restricts web results to research-affiliated
    websites; the `firecrawl_research_*` tools are a separate surface over paper abstracts and full text
    (PubMed, bioRxiv, medRxiv, arXiv). Query operators, domain filters, `categories`, `toolDetail` and
    `scrapeOptions` are described on their parameters. Returns source-type result groups and usage metadata.
    Authenticated responses can include an `id` for optional search feedback.'
- name: firecrawl_parse
  description: 'Parse one supported document into markdown, HTML, links, summary, targeted answers, or
    JSON matching a schema. Supported inputs include common HTML, PDF, Word, RTF, OpenDocument, and spreadsheet
    files; PDF parsing can be bounded with `pdfOptions.maxPages`.


    Local MCP reads `filePath` from the server filesystem. Hosted MCP uses two calls: first provide `filePath`
    to receive upload instructions, upload locally, then call again with the returned `uploadRef`; do
    not send both fields together. Remote web URLs belong in `firecrawl_scrape`.


    Set `redactPII` to request redaction of personally identifiable information in the returned content.
    `zeroDataRetention` requires an eligible authenticated account; omit it for anonymous keyless use.
    Returns upload instructions for hosted phase one or parsed document content for the final call. Authenticated
    final responses can include a `data.metadata.scrapeId` for optional parse feedback.'
